<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life</title>
  
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #3498db; /* Energetic arcade blue background */
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      color: #2b2b2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container-card {
      background-color: #ffffff;
      border: 5px solid #2b2b2b;
      border-radius: 25px;
      padding: 40px;
      max-width: 550px;
      width: 85%;
      text-align: center;
      box-shadow: 0px 12px 0px #2b2b2b;
      margin: 20px 0;
    }

    /* Goofy Comic Sans Style */
    h1 {
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      font-size: 52px;
      margin: 0 0 10px 0;
    }

    p.subtitle {
      font-size: 18px;
      color: #555555;
      margin-bottom: 25px;
    }

    input[type="date"] {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
      border: 3px solid #2b2b2b;
      border-radius: 10px;
      outline: none;
      margin-bottom: 20px;
      width: 80%;
      text-align: center;
    }

    .calc-btn {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: bold;
      font-size: 18px;
      background-color: #2ecc71; 
      color: white;
      padding: 12px 30px;
      border: 3px solid #2b2b2b;
      border-radius: 12px;
      box-shadow: 0px 6px 0px #2b2b2b;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .calc-btn:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px #2b2b2b;
    }

    .results-box {
      display: none; 
      margin-top: 30px;
      border-top: 3px dashed #2b2b2b;
      padding-top: 25px;
      text-align: left;
    }

    .stat-row {
      font-size: 20px;
      margin: 15px 0;
      font-weight: bold;
    }

    .stat-number {
      color: #e74c3c; 
      font-size: 24px;
    }

    .home-link {
      position: fixed;
      bottom: 25px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 8px 20px;
      border-radius: 8px;
      background-color: rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    .home-link:hover {
      background-color: #ffffff;
      color: #3498db;
    }
  </style>
</head>
<body>

  <div class="container-card">
    <h1>Life</h1>
    <p class="subtitle">Enter your birthday to see your existence broken down into extreme metrics.</p>
    
    <input type="date" id="birthdate-input">
    <br>
    <button class="calc-btn" onclick="calculateLifeStats()">Reveal My Stats ✨</button>

    <div class="results-box" id="results-panel">
      <div class="stat-row">🗓️ Total Months Lived: <span class="stat-number" id="months-stat">0</span></div>
      <div class="stat-row">☀️ Total Days Survived: <span class="stat-number" id="days-stat">0</span></div>
      <div class="stat-row">⏰ Approximate Hours Passed: <span class="stat-number" id="hours-stat">0</span></div>
      <div class="stat-row">💓 Estimated Heartbeats: <span class="stat-number" id="hearts-stat">0</span></div>
    </div>
  </div>

  <!-- 🎯 POINTS TO YOUR PERFECTLY SPELLED HOMEPAGE -->
  <a href="index.html" class="home-link">↩ Go Back Home</a>

  <script>
    function calculateLifeStats() {
      let inputVal = document.getElementById("birthdate-input").value;
      if (!inputVal) {
        alert("Please pick a birth date first! 😊");
        return;
      }

      let birthDate = new Date(inputVal);
      let today = new Date();

      let diffInMs = today - birthDate;
      if (diffInMs < 0) {
        alert("Wait a minute, you aren't born in the future! 🚀");
        return;
      }

      let totalDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
      let totalHours = Math.floor(diffInMs / (1000 * 60 * 60));
      
      let totalMonths = (today.getFullYear() - birthDate.getFullYear()) * 12;
      totalMonths += today.getMonth() - birthDate.getMonth();

      let totalMinutes = Math.floor(diffInMs / (1000 * 60));
      let estimatedHeartbeats = totalMinutes * 80;

      document.getElementById("months-stat").innerText = totalMonths.toLocaleString();
      document.getElementById("days-stat").innerText = totalDays.toLocaleString();
      document.getElementById("hours-stat").innerText = totalHours.toLocaleString();
      document.getElementById("hearts-stat").innerText = estimatedHeartbeats.toLocaleString();

      document.getElementById("results-panel").style.display = "block";
    }
  </script>

</body>
</html>
